name: Release

# Tag-driven, and gated. Pushing v* runs the full CI suite — tests on 3.10
# through 3.14, lint, type-check, and the per-file coverage floor — and only if
# all of it passes does anything get built, attached to a GitHub Release, or
# published to PyPI via Trusted Publishing (OIDC). No API token is stored here.
#
# The gate is `ci.yml` itself, called as a reusable workflow, not a second copy
# of the same steps. A copy drifts from the original, and the copy is the one a
# release would be trusting.
#
# PyPI setup (one time), at https://pypi.org/manage/account/publishing/ :
#   PyPI project name  manage-gitignore
#   Owner              grammy-jiang
#   Repository         manage-gitignore
#   Workflow           release.yml
#   Environment        pypi
# A failed `pypi` job uploads nothing, so the version is not burned: fix the
# publisher and re-run the job. `build` and `github-release` still succeed, so a
# tag always produces downloadable artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Per tag, not one group for every release. GitHub keeps at most one pending run
# per group, so a shared group makes a third tag cancel the second while the
# first is still running -- `cancel-in-progress: false` does not prevent that,
# and a tag would silently produce no artifacts at all. Keyed on the ref, the
# only thing this serialises is the same tag racing itself, which is the case
# that can actually collide: a push and a manual re-run.
#
# Never cancelling matters for the same reason it always did: the upload to PyPI
# cannot be undone, so a cancelled run could leave a version attached to a
# GitHub Release and missing from the index, or the reverse.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap and first: a tag that disagrees with the packaged version fails in
  # seconds rather than after five test matrices have run.
  check-tag:
    name: Tag matches the packaged version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials: false -- checkout otherwise leaves the job's
        # GITHUB_TOKEN in .git/config, where anything that later archives the
        # workspace would carry it out with them. Nothing here pushes with git.
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match project version $pkg" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches project version $pkg"

  # Every gate CI applies to a pull request, applied to the tag as well.
  gates:
    name: Gates
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the artifacts
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials: false -- checkout otherwise leaves the job's
        # GITHUB_TOKEN in .git/config, where anything that later archives the
        # workspace would carry it out with them. Nothing here pushes with git.
        with:
          persist-credentials: false

      # The tagged commit's own timestamp, which is a property of the tag rather
      # than of when this job happened to run. Read from git rather than passed
      # in, so re-running the workflow on the same tag produces the same value.
      - name: Take the timestamp from the commit
        id: stamp
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      # No `cache: pip` here, deliberately, and this is the one job where that
      # matters: a cache is writable by workflow runs with fewer privileges than
      # this one, so restoring it into the job that builds what gets published
      # to PyPI would let a lower-privileged run reach the artifact. Downloading
      # `build` afresh costs a few seconds. The CI jobs keep their cache; none
      # of them produces anything that leaves the runner.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The pinned `build`, from the dev extra. `pip install build` took
      # whatever released that morning into the one job whose output is
      # published to PyPI -- the last place an unreviewed version should turn
      # up. Installing the extra also costs nothing here: this job deliberately
      # has no pip cache.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      # SOURCE_DATE_EPOCH makes the artifacts reproducible: without it every
      # file in the wheel is stamped with the moment the runner happened to
      # unpack it, so two builds of one tag differ and "this artifact is that
      # tag" cannot be checked by anybody. With it, the timestamps come from the
      # tagged commit, and a rebuild of the tag is byte-identical.
      - name: Build sdist and wheel
        env:
          SOURCE_DATE_EPOCH: ${{ steps.stamp.outputs.epoch }}
        run: python -m build

      - name: Check metadata
        run: pipx run twine check dist/*

      # v6 is the first upload-artifact on Node 24; v4 and v5 target Node 20,
      # which GitHub deprecated and now force-runs on 24 anyway. v7 adds an
      # opt-in `archive` parameter we do not set.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github-release:
    name: Attach them to a GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # `gh release create` writes a Release; nothing else here does
    steps:
      # v7 is the first download-artifact on Node 24. v8 also makes a digest
      # mismatch fail the run rather than log a warning, which is what we want
      # here: a corrupted artifact must not reach a GitHub Release or PyPI. Its
      # other breaking change — the path layout for downloads by artifact ID —
      # does not apply; this downloads by name.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  pypi:
    name: Publish to PyPI
    # Last, and only after the artifacts are already downloadable from the
    # GitHub Release. A PyPI upload is the one step in this workflow that cannot
    # be undone — a version number, once published, can never be reused.
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/manage-gitignore
    permissions:
      id-token: write # the OIDC token Trusted Publishing exchanges; no secret
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
