name: Release

# Tag-driven, and gated. Pushing v* runs the full CI suite — tests on 3.10
# through 3.14, lint, type-check, and the per-file coverage floor — and only if
# all of it passes does anything get built, attached to a GitHub Release, or
# published to PyPI via Trusted Publishing (OIDC). No API token is stored here.
#
# The gate is `ci.yml` itself, called as a reusable workflow, not a second copy
# of the same steps. A copy drifts from the original, and the copy is the one a
# release would be trusting.
#
# PyPI setup (one time), at https://pypi.org/manage/account/publishing/ :
#   PyPI project name  manage-gitignore
#   Owner              grammy-jiang
#   Repository         manage-gitignore
#   Workflow           release.yml
#   Environment        pypi
# A failed `pypi` job uploads nothing, so the version is not burned: fix the
# publisher and re-run the job. `build` and `github-release` still succeed, so a
# tag always produces downloadable artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap and first: a tag that disagrees with the packaged version fails in
  # seconds rather than after five test matrices have run.
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match project version $pkg" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches project version $pkg"

  # Every gate CI applies to a pull request, applied to the tag as well.
  gates:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  pypi:
    # Last, and only after the artifacts are already downloadable from the
    # GitHub Release. A PyPI upload is the one step in this workflow that cannot
    # be undone — a version number, once published, can never be reused.
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/manage-gitignore
    permissions:
      id-token: write # the OIDC token Trusted Publishing exchanges; no secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
