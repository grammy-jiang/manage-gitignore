name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable, so `release.yml` gates a tag on these exact jobs rather than on a
  # copy of them. A copy would drift, and the copy is the one a release trusts.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims in `requires-python` and in its
        # classifiers. A claim nothing runs against is a guess.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials: false -- checkout otherwise leaves the job's
        # GITHUB_TOKEN in .git/config, where anything that later archives the
        # workspace would carry it out with them. Nothing here pushes with git.
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Configure git
        # The suite drives real repositories; git needs an identity to commit.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Test
        # No network: the suite stubs curl on PATH, so a green run here proves
        # the offline fixtures still exercise the real fetch path.
        run: pytest

  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials: false -- checkout otherwise leaves the job's
        # GITHUB_TOKEN in .git/config, where anything that later archives the
        # workspace would carry it out with them. Nothing here pushes with git.
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The oldest supported version, so a construct newer than 3.10 is
          # caught by the type-checker here rather than by a user on 3.10.
          python-version: "3.10"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy

  installer:
    # The installer is the half of this package that touches the operating
    # system, and it does it with symlinks -- which Windows restricts, and which
    # macOS spells the same as Linux but is worth proving rather than assuming.
    # Claude Code ships on all three, and the README tells all three to run
    # `manage-gitignore install`.
    #
    # Only these two files: the rest of the suite drives real git repositories
    # and a stubbed `curl` on PATH, which is a POSIX shell-script arrangement.
    # Making that portable is a separate piece of work, and claiming it here by
    # running a suite that skips half of itself would be worse than saying so.
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials: false -- checkout otherwise leaves the job's
        # GITHUB_TOKEN in .git/config, where anything that later archives the
        # workspace would carry it out with them. Nothing here pushes with git.
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test the installer
        run: python -m pytest tests/test_cli.py tests/test_agents.py

  hooks:
    # Every hook in .pre-commit-config.yaml -- gitleaks, markdownlint, yamllint
    # and the base hygiene set (trailing whitespace, end-of-file, check-yaml,
    # check-json, large files, merge conflicts, line endings) -- is configured
    # nowhere else. Until this job existed they ran only on a machine where
    # somebody had run `pre-commit install`, so a change made through the GitHub
    # web editor never met any of them.
    name: Hooks (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials: false -- checkout otherwise leaves the job's
        # GITHUB_TOKEN in .git/config, where anything that later archives the
        # workspace would carry it out with them. Nothing here pushes with git.
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      # The hooks build their own environments -- Go for gitleaks, Node for
      # markdownlint -- which is most of the runtime. Keyed on the config, so a
      # rev bump rebuilds and nothing else does.
      - name: Cache hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install pre-commit pyyaml

      # --show-diff-on-failure: the fixer hooks rewrite files, and the diff is
      # the actionable part. Without it a failure says only that something
      # changed.
      - name: Run every hook
        run: pre-commit run --all-files --show-diff-on-failure

      # The gitleaks *hook* is `gitleaks git --pre-commit --staged`, which is
      # right locally -- it stops a secret becoming a commit -- and inert here:
      # a fresh checkout stages nothing, so it inspects an empty diff. Measured,
      # not assumed: a repository with an AWS-shaped key committed to it reports
      # "Detect hardcoded secrets....Passed" under `pre-commit run --all-files`,
      # while `gitleaks dir` on the same tree reports the leak.
      #
      # So CI scans the content the pull request would actually merge, at the
      # version .pre-commit-config.yaml pins -- read from that file rather than
      # written down again, so the two cannot drift into different rule sets.
      - name: Scan the checked-out tree for secrets
        run: |
          rev=$(python -c "
          import yaml
          config = yaml.safe_load(open('.pre-commit-config.yaml'))
          print(next(r['rev'] for r in config['repos'] if 'gitleaks' in r['repo']))
          ")
          echo "gitleaks $rev, the version .pre-commit-config.yaml pins"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${rev}/gitleaks_${rev#v}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner

  coverage:
    name: Coverage (every file >= 95%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials: false -- checkout otherwise leaves the job's
        # GITHUB_TOKEN in .git/config, where anything that later archives the
        # workspace would carry it out with them. Nothing here pushes with git.
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Configure git
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Measure
        # MG_COVER_SUBPROCESS makes the suite run each script under coverage as
        # well. Most of it drives them as subprocesses, which a plain run cannot
        # see -- without this the report understates coverage by about a third.
        env:
          MG_COVER_SUBPROCESS: "1"
        run: pytest --cov --cov-report=

      - name: Report
        run: coverage report

      - name: Gate
        # A project total hides a hole, so the floor is per file. This is the
        # same script `make coverage` runs, so local and CI cannot drift.
        run: python tests/check_coverage.py --min 95
