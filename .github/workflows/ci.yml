name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable, so `release.yml` gates a tag on these exact jobs rather than on a
  # copy of them. A copy would drift, and the copy is the one a release trusts.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims in `requires-python` and in its
        # classifiers. A claim nothing runs against is a guess.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Configure git
        # The suite drives real repositories; git needs an identity to commit.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Test
        # No network: the suite stubs curl on PATH, so a green run here proves
        # the offline fixtures still exercise the real fetch path.
        run: pytest

  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The oldest supported version, so a construct newer than 3.10 is
          # caught by the type-checker here rather than by a user on 3.10.
          python-version: "3.10"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy

  coverage:
    name: Coverage (every file >= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Configure git
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Measure
        # MG_COVER_SUBPROCESS makes the suite run each script under coverage as
        # well. Most of it drives them as subprocesses, which a plain run cannot
        # see -- without this the report understates coverage by about a third.
        env:
          MG_COVER_SUBPROCESS: "1"
        run: pytest --cov --cov-report=

      - name: Report
        run: coverage report

      - name: Gate
        # A project total hides a hole, so the floor is per file. This is the
        # same script `make coverage` runs, so local and CI cannot drift.
        run: python tests/check_coverage.py --min 90
