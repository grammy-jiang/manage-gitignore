# Managed with the manage-precommit skill -- https://pre-commit.com
# Install the git hook:  pre-commit install
# Run on all files:      pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
exclude: '^\.gitignore$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml # pyproject.toml is the one file every gate reads
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-shebang-scripts-are-executable
  # A bare `# noqa` would switch off every rule on a line, including ones nobody
  # was arguing with. This repository's ignores are narrow and carry a reason;
  # this keeps it that way.
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
  # Same two commands `make verify` and CI run, at the point where fixing them
  # is cheapest. The rev tracks the `ruff>=0.5` dev dependency; when they drift,
  # the hook and the gate disagree about what the code should look like.
  # The workflows are code too, and the only code here that runs with a token.
  # zizmor reads them for the mistakes YAML cannot have an opinion about:
  # credentials left in .git/config, a cache restored into a publishing job,
  # permissions wider than the job needs.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        # Every finding, not just the default set. The two extra classes it adds
        # are jobs without names and permissions without a comment saying why --
        # both worth keeping in a workflow that publishes to PyPI.
        args: ["--no-progress", "--persona=auditor"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
