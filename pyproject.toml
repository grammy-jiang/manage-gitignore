[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manage-gitignore"
version = "0.1.0"
description = "Build a repository's .gitignore from gitignore.io, keeping its own custom rules — with a Claude Code skill that drives it"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Grammy Jiang", email = "grammy.jiang@gmail.com" }]
keywords = ["gitignore", "git", "claude", "claude-code", "agent-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
# No third-party runtime dependencies on purpose: `curl` and `git` on PATH are
# the only things this needs beyond the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/grammy-jiang/manage-gitignore"
Repository = "https://github.com/grammy-jiang/manage-gitignore"
Issues = "https://github.com/grammy-jiang/manage-gitignore/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
manage-gitignore = "manage_gitignore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manage_gitignore"]

[tool.hatch.build.targets.wheel.force-include]
# The skill ships inside the wheel so `install-skill` works from a plain
# `pip install`, with no checkout present.
"skill" = "manage_gitignore/skill"

[tool.hatch.build.targets.sdist]
include = ["src", "skill", "tests", "README.md", "LICENSE", "Makefile", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = ["slow: takes more than a second"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["manage_gitignore", "conftest"]

[tool.ruff.lint.per-file-ignores]
# Tests build long literal fixtures and reach into module internals on purpose.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/manage_gitignore"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
