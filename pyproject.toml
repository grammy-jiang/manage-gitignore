[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manage-gitignore"
version = "0.3.1"
description = "Build a repository's .gitignore from gitignore.io, keeping its own custom rules — with an agent skill that drives it"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Grammy Jiang", email = "grammy.jiang@gmail.com" }]
keywords = ["gitignore", "git", "agent-skill", "claude-code", "codex", "github-copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
# No third-party runtime dependencies on purpose: `curl` and `git` on PATH are
# the only things this needs beyond the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/grammy-jiang/manage-gitignore"
Repository = "https://github.com/grammy-jiang/manage-gitignore"
Issues = "https://github.com/grammy-jiang/manage-gitignore/issues"

[project.optional-dependencies]
# PyYAML is a *test* dependency only: SKILL.md's frontmatter is a contract with
# three products that each parse it with a real YAML parser, so the test that
# holds it to the Agent Skills spec must parse it the same way. The skill itself
# still imports nothing outside the standard library -- see tests/test_cli.py.
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    # Pinned, not floored: .pre-commit-config.yaml names an exact ruff, and a
    # hook that formats differently from the gate is worse than no hook. The
    # two move together or not at all.
    "ruff==0.16.2",
    "mypy>=1.8",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # tests/test_merge_properties.py states the merge's invariants and lets
    # Hypothesis look for a counterexample. Test-only, like PyYAML; the skill
    # still imports nothing outside the standard library.
    "hypothesis>=6.100",
    # `make build` already assumed this; tests/test_packaging.py builds a wheel
    # and reads what came out, so now it is declared rather than assumed.
    "build>=1.0",
    # The build backend, declared a second time on purpose. [build-system] tells
    # a *builder* to fetch it into an isolated environment -- over the network,
    # which no test here may need. Having it installed lets that test build with
    # --no-isolation and stay offline.
    "hatchling",
]

[project.scripts]
manage-gitignore = "manage_gitignore.cli:main"

[tool.hatch.build.targets.wheel]
# The skill lives at src/manage_gitignore/skill/ and ships as ordinary package
# data. Deliberately no force-include: a build-time path remap would make an
# installed file's path unresolvable against the checkout, so a traceback or a
# path in site-packages could not be traced back here by relative position.
# Repository layout and installed layout are the same tree.
packages = ["src/manage_gitignore"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "Makefile", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two roots because there are two things under test: the installer, imported as
# a package, and the skill's scripts, which are run by path and so import each
# other as top-level modules. Putting the scripts directory on the path is what
# a plain `python3 <skill-dir>/scripts/foo.py` does for free.
pythonpath = ["src", "src/manage_gitignore/skill/scripts"]
# -n auto: the suite spends most of its time in subprocesses and throwaway git
# repos, so it parallelises well. --dist loadfile keeps a module's tests on one
# worker, which keeps a failure's output contiguous and readable.
addopts = "-q --strict-markers --strict-config -n auto --dist loadfile"
markers = ["slow: takes more than a second"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
parallel = true          # subprocess runs each write their own data file
source = ["src/manage_gitignore"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",   # the entry line itself; main() is tested
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# S is flake8-bandit. Two scripts here exist to run `git` and `curl`, so the
# ruleset that asks about subprocesses is the one most worth having: it does not
# find a bug in either call, but it makes "this is safe, and here is why" a
# comment next to the call rather than an argument nobody wrote down.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# The skill's scripts import each other as top-level modules, so name them here
# or isort files them with the standard library.
known-first-party = ["manage_gitignore", "conftest", "shared", "templates", "gitwork", "summary"]

[tool.ruff.lint.per-file-ignores]
# Tests build long literal fixtures and reach into module internals on purpose.
# S101: `assert` is how a test states its claim.
# S603/S607: the suite drives real git repositories and runs the scripts as
# subprocesses, by design -- "git behaviour is tested against real repositories,
# not mocks" is a rule of this repository, not an oversight.
"tests/*" = ["E501", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
# Two roots, because there are two programs here: the installer package, and the
# skill's scripts, which resolve each other from their own directory the way any
# script run by path does. Both must be declared as package bases -- given only
# one, mypy reaches a script under two module names at once
# ("manage_gitignore.skill.scripts.shared" and "shared") and refuses to check
# anything. Listing the files rather than the package directory keeps the walk
# from descending into the skill a second time.
mypy_path = ["src", "src/manage_gitignore/skill/scripts"]
explicit_package_bases = true
namespace_packages = true
files = [
    "src/manage_gitignore/__init__.py",
    "src/manage_gitignore/cli.py",
    "src/manage_gitignore/skill/scripts",
]
# strict, which subsumes the three flags that used to be listed here
# (warn_unused_ignores, warn_redundant_casts, no_implicit_optional) and adds the
# one that matters most for a program that decides whether to mutate somebody's
# repository: every function is annotated, so there is nowhere the checker is
# not looking.
strict = true
